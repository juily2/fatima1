<style>

;border-radius:50px;letter-spacing:.12em;display:inline-flex;align-items:center;gap:25px}.primary:hover{background:#692236}.primary span{font-size:20px;line-height:1}.back,.choice{background:none;border:0}.back{padding:12px 0;letter-spacing:.09em;text-transform:none}.back:hover{text-decoration:underline}.actions{display:flex;align-items:center;gap:21px;flex-wrap:wrap}.choice{border:1px solid var(--line);border-radius:2px;padding:8px 12px;letter-spacing:.08em;text-transform:none}.choice[aria-pressed=true]{background:#eed8d4;border-color:var(--wine);color:var(--wine)}.choices{display:flex;gap:7px;margin:-7px 0 22px}.plate{position:relative;background:#e9ddc9;border:1px solid #b6a993;padding:8px;transform:rotate(1deg);box-shadow:5px 6px 0 #ded1bc88}.plate svg{display:block;width:100%;height:auto;max-height:59vh;background:#f2e5cf}.rail{padding-top:9px;border-top:1px solid var(--line);margin:0 2px}.rail i{font-size:15px}.plate figcaption{padding:8px 7px 1px}.plate{margin:0 3% 0 0}footer{border-top:1px solid var(--line);padding:20px 0 25px}.marks{display:flex;gap:6px}.marks i{height:3px;width:22px;background:#d6cbbb}.marks i.on{background:var(--wine)}.pagein{animation:pagein .55s both}@keyframes pagein{from{opacity:.25;transform:translateY(7px)}to{opacity:1;transform:none}}[hidden]{display:none!important}@media(max-width:750px){header{height:62px}.tag{font-size:8px}.spread{grid-template-columns:1fr;padding:22px 0 28px;gap:24px}.plate{grid-row:1;width:min(100%,405px);margin:auto}.plate svg{height:clamp(200px,30vh,320px)}.copy{padding:0}.rail i{font-size:12px}.rail{padding-top:5px}.plate figcaption{padding:4px 5px 0}h1{font-size:clamp(49px,11vw,70px);margin:16px 0 13px}h1 em{display:inline}p{font-size:17px;margin-bottom:16px}.brand{font-size:22px}.micro,.foot,.count{font-size:9px}.primary{padding:12px 17px}.book{padding:0 20px}footer{flex-wrap:wrap}.marks i{width:14px}}@media(prefers-reduced-motion:reduce){*{animation:none!important}}

body:before{opacity:.045}.book{max-width:1620px;padding:0 clamp(23px,5vw,85px)}header{height:76px}.brand{font-style:italic;font-size:30px}.seal{color:#ffb6a7;font-style:normal}.tag,.count,.foot,.label{color:#c3afa9}.spread{grid-template-columns:.83fr 1.17fr;gap:0;padding:18px 0 12px;min-height:calc(100svh - 138px)}.copy{position:relative;z-index:1;padding:36px 0 55px 4%}.kicker{color:#efb99e}.kicker:before{width:43px}.kicker,.micro,.label,.tag,.foot,.count{letter-spacing:.2em}h1{font-weight:normal;font-size:clamp(64px,7.7vw,132px);margin:33px 0 23px;line-height:.91;letter-spacing:-.07em}h1 em{color:#f5b0ad;text-shadow:0 4px 40px #db797c1c}p{font-size:clamp(17px,1.45vw,23px);color:#d7c8bf;max-width:33ch}.primary{border:0;background:#f4c9b9;color:#33202a;padding:15px 20px 15px 23px}.primary:hover{background:#ffe0cf}.primary span{border-left:1px solid #977d77;padding-left:16px}.choice{color:#ecddd3;border-color:#685a61}.choice[aria-pressed=true]{background:#463039;color:#ffcec4;border-color:#df9e91}.back{color:#e3cfc4}.plate{width:100%;max-width:800px;justify-self:end;margin:0;padding:0;border:0;background:transparent;box-shadow:none;transform:none}.plate svg{background:none;width:100%;height:auto;max-height:72vh;overflow:visible}.plate figcaption{width:82%;margin:-3px auto 0;padding:0}.rail{padding:9px 0 0;border-color:#78635e}.rail i{color:#e3c6b6}.marks i{height:2px;background:#50454e}.marks i.on{background:#ffb3ac}footer{min-height:62px;padding:14px 0}.glowstar{animation:twinkle 4s ease-in-out infinite alternate}@keyframes twinkle{to{opacity:.32}}.plate-enter{animation:ink .8s ease-out}@keyframes ink{from{opacity:.2;transform:translateY(5px)}to{opacity:1;transform:none}}.chapter-note{display:block;margin:24px 0 0;font:italic 14px Georgia;color:#b49f9a}.copy:after{content:"";width:52px;height:1px;display:block;background:#7e6867;margin-top:28px}

</style></head><body><div class="book"><header><div class="brand"><span class="seal" aria-hidden="true">❦</span> Florilegium</div><div class="tag">The Nocturne Edition &nbsp; / &nbsp; Nº 02</div></header>
<main class="spread"><section class="copy" aria-labelledby="title"><div class="kicker micro" id="kicker">Leaf I · The invitation</div><h1 id="title" tabindex="-1">Love, in <em>bloom.</em></h1><p id="bodycopy"></p><div class="choices" id="choices" role="group" aria-label="Choose a flower" hidden></div><div class="actions"><button class="primary" id="next"></button><button class="back" id="back" hidden>← Back a leaf</button></div></section><figure class="plate"><svg id="art" viewBox="0 0 620 535" role="img" aria-labelledby="artTitle"></svg><figcaption><div class="rail"><span class="label" id="plateNo"></span><i id="specimen"></i></div></figcaption></figure></main><footer><div class="foot">A love letter in five leaves</div><div class="marks" aria-hidden="true"></div><div class="count" id="count"></div></footer><noscript>Please enable JavaScript to turn the leaves of this letter.</noscript></div>
<script>
const el=id=>document.getElementById(id),fl=['Poppy','Cosmos','Daisy'],names=['Papaver rhoeas','Cosmos bipinnatus','Bellis perennis'],rom=['I','II','III','IV','V'];let step=0,flower=0;
const pages=[
['The invitation','Love, in','bloom.','The garden closes at dusk. I slipped a flower through the gate for you. There is a letter tied to its stem.','Open the letter'],
['The gathering','Pick me','a flower.','If we were walking home with just one stem between us, which one would you carry?','Keep this bloom'],
['The noticing','The smallest','things.','You always turn the chipped side of the cup toward yourself. I notice. I wanted you to know that I notice.','Turn the leaf'],
['The almost','What I nearly','said.','At the crossing, the light went green. You took my hand. For three whole streets I forgot where we were going.','Unfold the last page'],
['The confession','It was always','you.','','Read it again']];

const tau=2*Math.PI,cs=Math.cos,sn=Math.sin,fmt=x=>x.toFixed(2),xy=p=>p.map(fmt).join(' '),line=(pts)=>'M'+pts.map(xy).join('L'),range=(n,fn)=>Array.from({length:n},(_,i)=>fn(i)).join('');
function flowerArt(x,y,sz,tilt,kind){
 const colors=[['#552432','#fbb1a0','#f68f93'],['#533150','#efabd2','#eba3c2'],['#6e6854','#fff3c9','#f2dca9']][kind];
 let n=[7,10,19][kind],w=[.63,.34,.17][kind];
 let petals=Array.from({length:n},(_,i)=>({i,a:i*tau/n+.35})).sort((a,b)=>sn(a.a)-sn(b.a));
 function petal({i,a}){let L=100+13*sn(i*3.41),curl=7*cs(i*4.2);
 function P(t,u){let wid=w*L*Math.pow(Math.max(0,sn(Math.PI*t*.86)),.8)*(.24+.76*t**.35);let v=wid*u;let r=9+t*L+8*cs(3*u+i)*t*t;let z=34*t*t+20*Math.abs(u)**1.8*t+9*sn(7*u+1.2*i)*t**3+curl*t;return [(r*cs(a)-v*sn(a)),(r*sn(a)+v*cs(a))*.68-z]}
 let patch='';for(let k=0;k<20;k++){let u=-1+k*.1;let pts=[];for(let l=0;l<=12;l++)pts.push(P(l/12,u));for(let l=12;l>=0;l--)pts.push(P(l/12,u+.104));patch+='<path d="'+line(pts)+'Z" fill="'+colors[0]+'"/>'}
 let ribs=range(55,k=>{let u=-1+2*k/54;let pts=Array.from({length:24},(_,j)=>P(j/23,u));return '<path d="'+line(pts)+'" fill="none" stroke="'+colors[k%4?1:2]+'" stroke-width="'+(k%5?.66:1.25)+'" opacity="'+fmt(.43+.40*(.5+.5*cs(u*9+i)))+'"/>'});
 let lip=line(Array.from({length:50},(_,k)=>P(1,-1+2*k/49)));return patch+ribs+'<path d="'+lip+'" fill="none" stroke="'+colors[1]+'" stroke-width="1.4"/>'}
 return '<g transform="translate('+x+' '+y+') rotate('+tilt+') scale('+sz+')">'+petals.map(petal).join('')+range(80,k=>{let a=k*2.4,r=Math.sqrt(k)*2.4;return '<circle cx="'+fmt(r*cs(a))+'" cy="'+fmt(.51*r*sn(a)-7)+'" r="'+(k%3?.95:1.6)+'" fill="'+(k%4?'#f6bd87':'#7d4543')+'"/>'})+'</g>'}
function frond(x,y,ang,size){return '<g transform="translate('+x+' '+y+') rotate('+ang+') scale('+size+')">'+range(34,k=>{let t=k/34;return '<path d="M0 0 Q'+fmt(-48+70*t)+' -46 '+fmt(-16+23*sn(t*Math.PI))+' -89" fill="none" stroke="#a8aa86" stroke-width=".65"/>'})+'</g>'}
function garden(k){return '<g fill="none" stroke="#b8ae87"><path d="M215 511C250 433 389 301 354 233M217 509Q294 382 210 321M219 509Q311 451 421 385" stroke-width="2"/><path d="M215 512Q339 349 354 234" opacity=".62"/></g>'+frond(306,357,53,.97)+frond(251,421,-46,.87)+frond(280,386,-16,.52)+frond(358,421,62,.65)+flowerArt(210,320,.57,-19,k)+flowerArt(424,385,.39,24,k)+flowerArt(354,232,1.47,-15,k)}
function moth(){let wing=range(83,k=>{let t=k/82;return '<path d="M0 10Q'+fmt(25+106*t)+' '+fmt(-123+39*t)+' '+fmt(155-36*t)+' '+fmt(-96+84*t)+'Q'+fmt(43+64*t)+' '+fmt(20+35*t)+' 0 10" fill="none" stroke="'+(k%5?'#d6ad9b':'#ffdfb0')+'" stroke-width=".75"/>'})+'<ellipse cx="88" cy="-40" rx="17" ry="11" transform="rotate(-23 88 -40)" fill="#292836" stroke="#d4ab94"/><circle cx="87" cy="-40" r="4" fill="#c29c83"/>'+range(47,k=>'<path d="M0 9Q'+(55+k)+' 0 '+(80-k*.9)+' '+(95-k*.48)+'Q23 53 0 9" fill="none" stroke="#c78983" stroke-width=".8"/>');return '<g transform="translate(320 269) rotate(-13) scale(1.3)">'+wing+'<g transform="scale(-1 1)">'+wing+'</g><ellipse cy="10" rx="7" ry="38" fill="#ccad82"/><path d="M0 -22q-5 -29 -22 -38m22 38q7 -27 21 -39" fill="none" stroke="#decba9"/></g>'}
function envelope(){return '<g transform="translate(308 294) rotate(-13)"><path d="M-134 -46L0 -139 134 -46v144h-268Z" fill="#b99280" stroke="#dec7a5"/><path d="M-107 -80h213V71h-213Z" fill="#ecd3b5" stroke="#a78277"/><g fill="#795244" font-family="Georgia" font-style="italic"><text x="-85" y="-47" font-size="19">My dearest,</text><text x="-83" y="-17" font-size="13">At the crossing, the light went green.</text></g><path d="M-134 -46l134 91 134 -91V98h-268Z" fill="#c29b8d" stroke="#e2bda9"/><path d="M-134 98L-13 12q13 -8 26 0l121 86" fill="#cea99a" stroke="#907064"/><circle cy="29" r="19" fill="#813b4c" stroke="#e0a09a"/><text text-anchor="middle" y="36" font-family="Georgia" font-size="23" fill="#f0bba5">❦</text></g>'}
function art(){
 let stars=range(79,i=>{let x=38+((i*183.37)%543),y=24+((i*i*33.47)%479);return '<circle cx="'+fmt(x)+'" cy="'+fmt(y)+'" r="'+(i%6?.82:1.55)+'" opacity="'+(.25+(i%6)*.08)+'" fill="#f1d4bd"/>'});
 let moonX=[347,273,326,347,295][step],moonY=[190,194,268,201,202][step],r=[142,119,149,110,154][step];
 let moon=range(130,k=>{let v=(k+.4)/130*2-1,w=r*Math.sqrt(1-v*v);return '<path d="M'+fmt(moonX-w)+' '+fmt(moonY+v*r)+'h'+fmt(2*w)+'" stroke="#e3b99c" stroke-width="'+fmt(.45+.65*(1-v)/2)+'"/>'});
 let paths='<g fill="none" stroke="#ac937c" stroke-width=".65" opacity=".6"><ellipse cx="315" cy="263" rx="239" ry="172" transform="rotate(-48 315 263)"/><ellipse cx="315" cy="263" rx="245" ry="179" transform="rotate(-48 315 263)" stroke-dasharray="1 7"/><path d="M62 418l65 -18 28 -52M505 100l21 -23h38"/></g>';
 let star='<g class="glowstar" fill="#ffddae"><path d="M137 102l2 12 11 2 -11 2 -2 12 -2 -12 -11 -2 11 -2Z"/><path d="M494 367l1 8 8 2 -8 1 -1 8 -2 -8 -8 -1 8 -2Z"/></g>';
 let plates=['Moon garden','The herbarium','The night visitor','An unsent letter','The keepsake'];
 let subject=step===2?moth():step===3?envelope():step===4?'<g transform="translate(310 290) rotate(-12)"><ellipse rx="135" ry="174" fill="#252632" stroke="#c39e83"/><ellipse rx="129" ry="168" fill="none" stroke="#b79979" stroke-dasharray="2 5"/><path d="M-16 115Q20 43 6 -33" fill="none" stroke="#b1ad86" stroke-width="2"/>'+frond(1,57,38,.67)+flowerArt(6,-29,1.06,8,flower)+'<text y="137" text-anchor="middle" fill="#e2bfaa" font-family="Georgia" font-style="italic">Yours, always</text></g>':step===1?'<g transform="translate(305 282)"><circle r="151" fill="#262633" stroke="#917e74"/><circle r="143" fill="none" stroke="#a49383" stroke-dasharray="1 6"/>'+flowerArt(0,15,1.32,-3,flower)+'</g>':garden(flower);
 el('art').innerHTML='<title id="artTitle">'+plates[step]+': an engraved night illustration</title><defs><radialGradient id="haze"><stop stop-color="#be7776" stop-opacity=".24"/><stop offset="1" stop-color="#8d687a" stop-opacity="0"/></radialGradient></defs><ellipse cx="321" cy="261" rx="288" ry="255" fill="url(#haze)"/>'+stars+paths+'<g opacity=".48">'+moon+'</g>'+subject+star+'<g fill="#bca598" font-family="Georgia" font-style="italic" font-size="13"><text x="39" y="444">Fig. '+rom[step]+'</text><text x="526" y="71">nox.</text></g>';el('specimen').textContent=step===1?names[flower]:plates[step]}
function render(focus=false){let a=pages[step];el('kicker').textContent='Leaf '+rom[step]+' · '+a[0];el('title').innerHTML=a[1]+' <em>'+a[2]+'</em>';el('bodycopy').textContent=step===4?'I love you. Here is the '+fl[flower].toLowerCase()+' you chose, a little bent from the journey. I would walk those three streets with you again tomorrow.':a[3];el('next').innerHTML=a[4]+' <span aria-hidden="true">'+(step===4?'↺':'→')+'</span>';el('back').hidden=!step;el('choices').hidden=step!==1;el('plateNo').textContent='Nocturne / Plate 0'+(step+1);el('count').textContent='Leaf 0'+(step+1)+' / 05';document.querySelector('.marks').innerHTML=pages.map((_,i)=>'<i class="'+(i<=step?'on':'')+'"></i>').join('');[...el('choices').children].forEach((b,i)=>b.setAttribute('aria-pressed',String(i===flower)));art();if(focus){let panel=document.querySelector('.plate');panel.classList.remove('plate-enter');void panel.offsetWidth;panel.classList.add('plate-enter');el('title').focus({preventScroll:true});let c=document.querySelector('.copy');c.classList.remove('pagein');void c.offsetWidth;c.classList.add('pagein')}}
fl.forEach((v,i)=>{let b=document.createElement('button');b.className='choice';b.textContent=v;b.onclick=()=>{flower=i;render()};el('choices').append(b)});el('next').onclick=()=>{step=(step+1)%5;if(!step)flower=0;render(true)};el('back').onclick=()=>{if(step)step--;render(true)};render()
</script></body></html>
