<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#f5efe3"><title>Florilegium — A Love Letter in Five Leaves</title><meta name="description" content="An illustrated, interactive love letter. Choose a bloom and follow it through five leaves.">
<style>
:root{--paper:#f5efe3;--ink:#332c28;--wine:#852e42;--line:#c9bdad;--serif:Georgia,'Times New Roman',serif;--sans:Arial,Helvetica,sans-serif}*{box-sizing:border-box}body{margin:0;color:var(--ink);background:radial-gradient(ellipse at 17% 35%,#fff9ec99,transparent 52%),var(--paper);font-family:var(--serif)}body:before{content:"";position:fixed;inset:0;pointer-events:none;z-index:3;opacity:.07;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.72' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Cpath fill='%23554433' filter='url(%23n)' opacity='.65' d='M0 0h180v180H0z'/%3E%3C/svg%3E")}button{font:inherit;cursor:pointer;color:inherit}button:focus-visible,h1:focus-visible{outline:3px solid #97532c;outline-offset:5px}.book{max-width:1390px;margin:auto;padding:0 clamp(20px,5vw,84px)}header,footer,.rail{display:flex;align-items:center;justify-content:space-between;gap:15px}header{height:88px;border-bottom:1px solid var(--line)}.brand{font-size:25px;letter-spacing:-1.5px;display:flex;align-items:center;gap:10px}.seal{font-size:31px;color:var(--wine)}.micro,.label,.foot,.tag,.choice,.primary,.back,.count{font:600 10px/1.5 var(--sans);letter-spacing:.18em;text-transform:uppercase}.tag,.count,.foot{color:#685b54}.spread{display:grid;grid-template-columns:1.05fr 1fr;min-height:min(690px,78vh);align-items:center;gap:4%;padding:38px 0}.copy{padding:24px 0 26px 4%}.kicker{color:var(--wine);display:flex;gap:12px;align-items:center}.kicker:before{content:"";width:32px;height:1px;background:currentColor}h1{font-weight:normal;font-size:clamp(54px,7.5vw,112px);line-height:.92;letter-spacing:-.075em;margin:32px 0 23px}h1 em{display:block;color:var(--wine);font-weight:400}p{font-size:clamp(17px,1.5vw,22px);line-height:1.55;max-width:34ch;margin:0 0 25px;color:#574940}.primary{padding:15px 23px;background:var(--wine);color:#fff9eb;border:1px solid var(--wine);border-radius:50px;letter-spacing:.12em;display:inline-flex;align-items:center;gap:25px}.primary:hover{background:#692236}.primary span{font-size:20px;line-height:1}.back,.choice{background:none;border:0}.back{padding:12px 0;letter-spacing:.09em;text-transform:none}.back:hover{text-decoration:underline}.actions{display:flex;align-items:center;gap:21px;flex-wrap:wrap}.choice{border:1px solid var(--line);border-radius:2px;padding:8px 12px;letter-spacing:.08em;text-transform:none}.choice[aria-pressed=true]{background:#eed8d4;border-color:var(--wine);color:var(--wine)}.choices{display:flex;gap:7px;margin:-7px 0 22px}.plate{position:relative;background:#e9ddc9;border:1px solid #b6a993;padding:8px;transform:rotate(1deg);box-shadow:5px 6px 0 #ded1bc88}.plate svg{display:block;width:100%;height:auto;max-height:59vh;background:#f2e5cf}.rail{padding-top:9px;border-top:1px solid var(--line);margin:0 2px}.rail i{font-size:15px}.plate figcaption{padding:8px 7px 1px}.plate{margin:0 3% 0 0}footer{border-top:1px solid var(--line);padding:20px 0 25px}.marks{display:flex;gap:6px}.marks i{height:3px;width:22px;background:#d6cbbb}.marks i.on{background:var(--wine)}.pagein{animation:pagein .55s both}@keyframes pagein{from{opacity:.25;transform:translateY(7px)}to{opacity:1;transform:none}}[hidden]{display:none!important}@media(max-width:750px){header{height:62px}.tag{font-size:8px}.spread{grid-template-columns:1fr;padding:22px 0 28px;gap:24px}.plate{grid-row:1;width:min(100%,405px);margin:auto}.plate svg{height:clamp(200px,30vh,320px)}.copy{padding:0}.rail i{font-size:12px}.rail{padding-top:5px}.plate figcaption{padding:4px 5px 0}h1{font-size:clamp(49px,11vw,70px);margin:16px 0 13px}h1 em{display:inline}p{font-size:17px;margin-bottom:16px}.brand{font-size:22px}.micro,.foot,.count{font-size:9px}.primary{padding:12px 17px}.book{padding:0 20px}footer{flex-wrap:wrap}.marks i{width:14px}}@media(prefers-reduced-motion:reduce){*{animation:none!important}}
</style></head><body><div class="book"><header><div class="brand"><span class="seal" aria-hidden="true">❦</span> Florilegium</div><div class="tag">An intimate edition &nbsp; / &nbsp; Nº 01</div></header>
<main class="spread"><section class="copy" aria-labelledby="title"><div class="kicker micro" id="kicker">Leaf I · The invitation</div><h1 id="title" tabindex="-1">In the quiet, <em>you.</em></h1><p id="bodycopy"></p><div class="choices" id="choices" role="group" aria-label="Choose a flower" hidden></div><div class="actions"><button class="primary" id="next"></button><button class="back" id="back" hidden>← Back a leaf</button></div></section><figure class="plate"><svg id="art" viewBox="0 0 520 460" role="img" aria-labelledby="artTitle"></svg><figcaption><div class="rail"><span class="label" id="plateNo"></span><i id="specimen"></i></div></figcaption></figure></main><footer><div class="foot">A love letter in five leaves</div><div class="marks" aria-hidden="true"></div><div class="count" id="count"></div></footer><noscript>Please enable JavaScript to turn the leaves of this letter.</noscript></div>
<script>
const el=id=>document.getElementById(id),fl=['Poppy','Cosmos','Daisy'],names=['Papaver rhoeas','Cosmos bipinnatus','Bellis perennis'],rom=['I','II','III','IV','V'];let step=0,flower=0;
const pages=[
['The invitation','In the quiet,','you.','I pressed a flower between these pages. I thought of writing your name beneath it. Instead, I left the whole book for you.','Open the letter'],
['The gathering','Pick me','a flower.','If we were walking home with just one stem between us, which one would you carry?','Keep this bloom'],
['The noticing','The smallest','things.','You always turn the chipped side of the cup toward yourself. I notice. I wanted you to know that I notice.','Turn the leaf'],
['The almost','What I nearly','said.','At the crossing, the light went green. You took my hand. For three whole streets I forgot where we were going.','Unfold the last page'],
['The confession','It was always','you.','','Read it again']];
function leaf(x,y,r,k){return '<g transform="translate('+x+' '+y+') rotate('+r+') scale('+k+')"><path d="M0 0Q-39 -29 -12 -81Q13 -37 0 0Z" fill="#849078" stroke="#495745"/><path d="M0 0Q-12 -43 -12 -76m8 52 -12 -15m9 -2 7 -13m-10 -3 -8 -12" fill="none" stroke="#526151"/></g>'}
function bloom(x,y,size,rot,kind){let n=[9,12,20][kind],c=[['#ba4555','#df817b'],['#aa596b','#d99aa0'],['#c1ac86','#fbefcf']][kind],out='';for(let j=0;j<n;j++){let a=(j*137.5)%360, w=[43,23,14][kind],h=[67,75,65][kind]*(.87+.15*Math.sin(j*3.2));out+='<g transform="rotate('+a+')"><path d="M0 4C-'+w+' -12 -'+(w+8)+' -'+(h-15)+' -'+(.58*w)+' -'+h+'Q-'+(w*.2)+' -'+(h+8)+' 0 -'+(h-2)+'Q'+(.8*w)+' -'+(h+13)+' '+w+' -'+(h-11)+'Q'+(w+9)+' -27 0 4Z" fill="'+c[j%2]+'" stroke="#71443e" stroke-width="1.3"/>';for(let t=-2;t<=2;t++)out+='<path d="M0 -2Q'+(t*w*.32)+' -33 '+(t*w*.36)+' -'+(h-7-Math.abs(t)*2)+'" fill="none" stroke="#743e3f" opacity=".32" stroke-width=".9"/>';out+='</g>'}out+='<circle r="12" fill="#655040"/>';for(let j=0;j<43;j++){let r=Math.sqrt(j)*1.95,a=j*2.4;out+='<circle cx="'+r*Math.cos(a)+'" cy="'+r*Math.sin(a)+'" r="1.15" fill="#e5b56a"/>'}return '<g transform="translate('+x+' '+y+') rotate('+rot+') scale('+size+')">'+out+'</g>'}
function art(){const shifts=[0,12,-9,15,-3],s=shifts[step];let st='<g fill="none" stroke="#53634d" stroke-linecap="round"><path d="M229 436Q308 302 308 141M229 436Q259 299 177 228M230 435Q312 362 373 275" stroke-width="4"/><path d="M231 435Q269 302 245 258" stroke-width="2.5"/></g>';let print='<defs><pattern id="hatch" width="5" height="5" patternUnits="userSpaceOnUse"><path d="M0 5l5 -5" stroke="#8e7564" stroke-width=".5"/></pattern></defs><g fill="none" stroke="#ae9980" opacity=".55"><rect x="9" y="9" width="502" height="442"/><ellipse cx="266" cy="230" rx="148" ry="177" stroke-dasharray="2 5"/><path d="M28 32h14m-7 -7v14m444 379h14m-7 -7v14"/></g><circle cx="358" cy="141" r="93" fill="url(#hatch)" opacity=".3"/>';let note=['First light','Chosen by hand','A closer look','Before the words','For you, always'][step];el('art').innerHTML='<title id="artTitle">Botanical illustration of '+fl[flower].toLowerCase()+' flowers</title>'+print+'<g transform="rotate('+s+' 260 330)">'+st+leaf(274,319,62,.86)+leaf(259,342,-42,.76)+leaf(327,329,66,.58)+leaf(238,299,-32,.53)+bloom(306,145,1.23,-15,flower)+bloom(176,226,.79,27,flower)+bloom(374,272,.52,-20,flower)+'</g><g fill="#6b5b50" font-family="Georgia,serif" font-style="italic"><text x="31" y="47" font-size="15">Fig. '+rom[step]+'</text><text x="30" y="421" font-size="15">'+note+'</text></g>';el('specimen').textContent=names[flower]}
function render(focus=false){let a=pages[step];el('kicker').textContent='Leaf '+rom[step]+' · '+a[0];el('title').innerHTML=a[1]+' <em>'+a[2]+'</em>';el('bodycopy').textContent=step===4?'I love you. Here is the '+fl[flower].toLowerCase()+' you chose, a little bent from the journey. I would walk those three streets with you again tomorrow.':a[3];el('next').innerHTML=a[4]+' <span aria-hidden="true">'+(step===4?'↺':'→')+'</span>';el('back').hidden=!step;el('choices').hidden=step!==1;el('plateNo').textContent='Botanical plate / 0'+(step+1);el('count').textContent='Leaf 0'+(step+1)+' / 05';document.querySelector('.marks').innerHTML=pages.map((_,i)=>'<i class="'+(i<=step?'on':'')+'"></i>').join('');[...el('choices').children].forEach((b,i)=>b.setAttribute('aria-pressed',String(i===flower)));art();if(focus){el('title').focus({preventScroll:true});let c=document.querySelector('.copy');c.classList.remove('pagein');void c.offsetWidth;c.classList.add('pagein')}}
fl.forEach((v,i)=>{let b=document.createElement('button');b.className='choice';b.textContent=v;b.onclick=()=>{flower=i;render()};el('choices').append(b)});el('next').onclick=()=>{step=(step+1)%5;if(!step)flower=0;render(true)};el('back').onclick=()=>{if(step)step--;render(true)};render()
</script></body></html>
